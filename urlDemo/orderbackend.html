        <!-- 右邊說明文字 -->
        <div class="right-panel">
            <h3>操作說明</h3>
            <ol>
                <li>
                    <dl>
                        <dt>使用者需輸入帳號與密碼進行登入，最多可連續失敗 5 次。</dt>
                        <dd>若連續登入失敗超過 5 次，系統將鎖定帳號 60 秒，期間無法再次登入。</dd>
                    </dl>
                </li>
                <li>
                    <dl>
                        <dt>步驟一：取得Token</dt>
                        <dd>使用者登入成功後，系統會核發一組 Token 作為後續操作的身份識別憑證。</dd>
                    </dl>
                    <dl>
                        <dt>步驟二：驗證Token</dt>
                        <dd>系統會先驗證原始 Token 的有效性，驗證通過後，再簽發一組暫時 Token 供特定作業使用。</dd>
                    </dl>
                </li>
                <li>
                    <dl>
                        <dt>登出</dt>
                        <dd>使用者登出時，系統會同時刪除該帳號的 Token 以及暫時 Token，以確保帳號安全。</dd>
                    </dl>
                </li>
            </ol>
