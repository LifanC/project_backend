# -----------------------------
# JWT 設定
# -----------------------------
jwt:
  expirationSeconds: 600

# -----------------------------
# Server 設定
# -----------------------------
server:
  servlet:
    context-path: /api

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# -----------------------------
# Spring Boot 通用設定
# -----------------------------
spring:
  config:
    import: optional:file:.env[.properties]
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  application:
    name: demo-app-test

  # Redis 本機設定
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 2000
      password: ${REDIS_PASSWORD}

  # 資料庫本機設定
  datasource:
    url: jdbc:postgresql://localhost:5432/interviewworks?currentSchema=interviewworks_schema
    username: postgres
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

# -----------------------------
# MyBatis 設定
# -----------------------------
mybatis:
  mapper-locations: classpath:Mapper/**/*.xml  #注意：一定要對應mapper映射xml文件的所在路徑
  configuration:
    #org.apache.ibatis.logging.stdout.StdOutImpl 控制檯打印sql語句方便調試sql語句執行錯誤
    #org.apache.ibatis.logging.log4j2.Log4j2Impl 這個不在控制檯打印查詢結果,但是在log4j中打印
    #org.apache.ibatis.logging.jdk14.Jdk14LoggingImpl 這個不在控制檯打印查詢結果,但是在log4j中打印
    log-impl: org.apache.ibatis.logging.jdk14.Jdk14LoggingImpl
    mapUnderscoreToCamelCase: true # 開啓駝峯命名轉換法

# -----------------------------
# Logging 設定
# -----------------------------
logging:
  config: classpath:log4j2.xml
# 暫時隱藏
#  level:
#    #這個指定你的dao層，也就是mapper文件的所在包
#    com.example.demo.Mapper: DEBUG
#    me.paulschwarz: DEBUG