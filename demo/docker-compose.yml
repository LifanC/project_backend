services:
  app:
    build:
      context: .
    image: springboot-app:1.0
    container_name: springboot-container
    ports:
      - "8080:8080"          # 本機 8080 對應容器 8080
#    volumes:
#      - "D:/project_backend/demo/src/main/resources/certs:/app/certs:cached"       # 本機憑證路徑
    environment:
      PORT: 8080
      SPRING_PROFILES_ACTIVE: docker
#      PERMISSION_KEYSTORE_PATH: /app/certs/permission-keystore.p12
#      USER_KEYSTORE_PATH: /app/certs/user-keystore.p12
#      KEYSTORE_PASSWORD: 1qaz@WSX
    depends_on:
      - redis
      - db
    restart: unless-stopped

  db:
    image: postgres:16
    container_name: postgres-container
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: interviewworks
    ports:
      - "5432:5432"
    volumes:
      - ./db-init:/docker-entrypoint-initdb.d
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: redis-container
    command: ["redis-server", "--requirepass", "1234"]
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres-data: