services:
  app:
    build:
      context: .
    image: springboot-app:1.0
    container_name: springboot-container
    env_file:
      - .env
    ports:
      - "8080:8080"          # 本機 8080 對應容器 8080
#    volumes:
#      - "D:/project_backend/demo/src/main/resources/certs:/app/certs:cached"       # 本機憑證路徑
    environment:
      PORT: 8080
      SPRING_PROFILES_ACTIVE: docker
#      PERMISSION_KEYSTORE_PATH: /app/certs/permission-keystore.p12
#      USER_KEYSTORE_PATH: /app/certs/user-keystore.p12
#      KEYSTORE_PASSWORD: ${KEYSTORE_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
    restart: unless-stopped

  db:
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
    image: postgres:16
    container_name: postgres-container
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: interviewworks
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - ./db-init:/docker-entrypoint-initdb.d
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: redis-container
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "6379:6379"
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:management
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    container_name: rabbitmq-container
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"      # Java AMQP connection
      - "15672:15672"    # RabbitMQ Web UI
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres-data: